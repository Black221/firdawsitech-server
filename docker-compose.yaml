version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: firdawsitech_postgres
    restart: always
    environment:
      POSTGRES_DB: firdawsitech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - firdawsitech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firdawsitech"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: firdawsitech_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@firdawsitech.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - firdawsitech_pgadmin_data:/var/lib/pgadmin

volumes:
  firdawsitech_postgres_data:
  firdawsitech_pgadmin_data:
