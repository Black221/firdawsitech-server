server:
  port: 8080
  servlet:
    context-path: /api/v1/
  multipart:
    max-file-size: 5MB
    max-request-size: 5MB

spring:
  application:
    name: firdawsitech-server

  datasource:
    url: jdbc:postgresql://localhost:5432/firdawsitech
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: MpsHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
    show-sql: false

  mvc:
    problem-details:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      whitelabel:
        enabled: false
  mail:
    host: smtp.gmail.com   # ou smtp.gmail.com / autre
    port: 587               # 587 pour TLS
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG         # Voir les requêtes SQL
    org.hibernate.orm.jdbc.bind: TRACE  # Voir les paramètres bind
  pattern:
    console: "%d{HH:mm:ss} %-5level %-40logger{36} : %msg%n"

# ===============================
# CONFIGS PERSONNALISÉES (si besoin)
# ===============================


app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: firdawsitech
    access-ttl-seconds: 3600       # 1h
    refresh-ttl-seconds: 2592000   # 30j

  mail:
    from: "Boutique <bambabar02@gmail.com>"
    admin: "bambabar02@gmail.com"

  files:
    upload-dir: uploads/images      # dossier local de stockage
    public-base-url: http://localhost:8080/api/v1/files/images  # URL publique des images