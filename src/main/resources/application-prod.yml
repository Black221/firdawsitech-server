server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1/

spring:
  application:
    name: firdawsitech-server

  # ============================
  #    DATASOURCE (PROD)
  # ============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/firdawsitech}
    username: ${DB_USER:app_user}
    password: ${DB_PASS:app_pass}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 60000
      connection-timeout: 30000
      pool-name: FirdawsiHikariPool
      leak-detection-threshold: 20000

  # ============================
  #    JPA / HIBERNATE
  # ============================
  jpa:
    hibernate:
      ddl-auto: update    # ⚠️ sécurité prod (NE PAS utiliser update)
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
    show-sql: false

  # ============================
  #       FLYWAY (PROD)
  # ============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${DB_SCHEMA:public}

  # ============================
  #       MAIL (PROD)
  # ============================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  # ============================
  #      UPLOADS / FILES
  # ============================
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  web:
    error:
      include-message: never
      include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: firdawsitech
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 2592000

  mail:
    from: ${MAIL_FROM:"Boutique <no-reply@firdawsitech.sn>"}
    admin: ${MAIL_ADMIN:"admin@firdawsitech.sn"}

  files:
    # le dossier se trouve dans le home de l'utilisateur système
    upload-dir: /opt/firdawsitech/uploads/images
    public-base-url: ${PUBLIC_FILES_URL:https://firdawsitech.sn/api/v1/files/images}

  bootstrap:
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
